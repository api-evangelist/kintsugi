publisherName: Kintsugi
serviceCategory: Tax Compliance and Automation
billingModel:
  pricingCategory: Hybrid
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Kintsugi
  ServiceCategory: Tax Compliance and Automation
  ProviderName: Kintsugi
  PublisherName: Kintsugi
  InvoiceIssuerName: Kintsugi
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: filings
  description: Sales tax returns prepared and filed, billed per filing on per-action plans.
  unit: filings
  aggregation: sum
  dimensions:
  - organization
  - state
- name: registrations
  description: State tax registrations completed, billed per registration on per-action plans.
  unit: registrations
  aggregation: sum
  dimensions:
  - organization
  - state
- name: subscription
  description: Flat monthly subscription fee on the Premium plan covering a set number of states.
  unit: months
  aggregation: sum
  dimensions:
  - organization
- name: states_covered
  description: Number of states under active monitoring, registration, and filing.
  unit: states
  aggregation: max
  dimensions:
  - organization
principles:
- name: Visibility
  description: Track active registrations and monthly filings by state; reconcile against the Kintsugi dashboard.
- name: Allocation
  description: Attribute filing and registration costs to the legal entities and states that generate the nexus obligation.
- name: Optimization
  description: Use free nexus monitoring to avoid premature registrations; compare per-filing Growth costs against flat-rate Premium once filing in more than a handful of states each month.
- name: Accountability
  description: Assign a compliance owner who reviews where new nexus is approaching and approves new registrations before filing fees accrue.
