- FOCUS
description: >-
  FinOps view of Kintsugi spend. Kintsugi bills compliance outcomes - sales tax
  filings and state registrations - rather than per-API-call usage. Nexus
  monitoring is free; the Growth plan bills per filing and per registration; the
  Premium plan is a flat monthly subscription covering a set number of states;
  Enterprise is negotiated. The API itself is included with a paid plan, so the
  primary cost drivers are number of filings, number of registrations, and
  states covered. Figures are not reconciled.
notes: >-
  Cost drivers for a tax-compliance platform are filing and registration
  volume by jurisdiction, not API request counts. Verify per-filing and
  per-registration fees and Premium state coverage against the Kintsugi
  pricing page during reconciliation.
sources:
- https://www.trykintsugi.com/pricing
- https://docs.trykintsugi.com
