aid: kintsugi
name: Kintsugi
review:
  question: Which Kintsugi is this catalog about, and does it expose a documented public REST API?
  answer: true
  date: '2026-06-21'
  reviewer: API Evangelist
  disambiguation: true
findings:
  summary: |
    This catalog covers Kintsugi the AI sales tax compliance and automation
    platform (trykintsugi.com), NOT the unrelated Kintsugi mental-health /
    voice-biomarker company (Kintsugi Mindful Wellness / kintsugihello.com).
    The sales-tax Kintsugi publishes a documented public REST API at
    https://api.trykintsugi.com/v1 with developer docs at docs.trykintsugi.com,
    official SDKs (Python, TypeScript, Java, PHP, Ruby) under the GitHub
    organization github.com/kintsugi-tax, an MCP server, and OpenAPI
    specifications. The API covers real-time tax estimation, transactions,
    customers, products and tax codes, address validation, nexus,
    registrations, exemptions, and filings.
  disambiguation:
    correctEntity:
      name: Kintsugi (sales tax automation)
      website: https://www.trykintsugi.com
      docs: https://docs.trykintsugi.com
      github: https://github.com/kintsugi-tax
      sector: Sales tax / VAT / GST compliance and automation
    notThisEntity:
      name: Kintsugi Mindful Wellness
      sector: Mental health, voice-based biomarker screening
      note: Distinct company sharing the Kintsugi name; out of scope for this catalog.
  authentication:
    scheme: apiKey
    headers:
      - name: x-api-key
        note: API key generated in the Kintsugi dashboard.
      - name: x-organization-id
        note: Identifies the organization the request acts on behalf of.
    bearerNote: |
      Kintsugi documents API-key header authentication (x-api-key plus
      x-organization-id), not HTTP Bearer token authentication. The OpenAPI
      security scheme in this repo models the documented apiKey headers
      accordingly.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.trykintsugi.com/v1
      documented: true
    - protocol: Webhooks
      scheme: https
      documented: true
      note: Event notifications referenced in integration guidance; payload contract not fully enumerated in the public reference.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket or streaming API is documented.
  endpointsConfirmedRest:
    - POST   https://api.trykintsugi.com/v1/tax/estimate
    - POST   https://api.trykintsugi.com/v1/transactions
    - GET    https://api.trykintsugi.com/v1/transactions
    - GET    https://api.trykintsugi.com/v1/transactions/{id}
    - GET    https://api.trykintsugi.com/v1/transactions/external/{external_id}
    - PATCH  https://api.trykintsugi.com/v1/transactions/{id}
    - POST   https://api.trykintsugi.com/v1/transactions/{id}/credit-notes
    - PATCH  https://api.trykintsugi.com/v1/transactions/{id}/credit-notes
    - GET    https://api.trykintsugi.com/v1/filings/{filing_id}/transactions
    - POST   https://api.trykintsugi.com/v1/customers
    - GET    https://api.trykintsugi.com/v1/customers
    - GET    https://api.trykintsugi.com/v1/customers/{id}
    - GET    https://api.trykintsugi.com/v1/customers/external/{external_id}
    - PATCH  https://api.trykintsugi.com/v1/customers/{id}
    - POST   https://api.trykintsugi.com/v1/products
