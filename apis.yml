  name: Kintsugi Tax Calculations API
  tags:
  - Tax Calculation
  - Tax Estimate
  - Sales Tax
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.trykintsugi.com/docs/api-guides/sales-tax-calculations
  baseURL: https://api.trykintsugi.com/v1
