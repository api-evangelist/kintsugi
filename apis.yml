    type: PostmanCollection
  - url: collections/kintsugi.opencollection.json
    type: OpenCollection
  description: Calculates sales tax, VAT, and GST for a transaction before payment
    via POST /tax/estimate, returning jurisdiction-level tax breakdown, taxable amount,
    effective rate, and active-registration status without persisting a record.
