aid: kintsugi
url: https://raw.githubusercontent.com/api-evangelist/kintsugi/refs/heads/main/apis.yml
name: Kintsugi
kind: company
description: Kintsugi is an AI-driven sales tax compliance and automation platform that
  calculates US sales tax, VAT, and GST in real time, monitors economic and physical
  nexus, manages exemptions and registrations, and auto-prepares and files returns.
  Its REST API exposes tax estimation, transactions, products, address validation,
  nexus, exemptions, registrations, and filings, authenticated with an API key plus
  organization ID header.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/kintsugi.png
tags:
- Sales Tax
- Tax Compliance
- Tax Automation
- VAT
